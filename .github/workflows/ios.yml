name: iOS Validation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Validate plist
        run: plutil -lint DualCamera/Info.plist

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Check whitespace errors
        run: git diff --check

      - name: Select an available iPhone simulator
        shell: bash
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin)["devices"]; phones=[d for runtime in data.values() for d in runtime if d.get("isAvailable") and d["name"].startswith("iPhone")]; preferred=next((d for d in phones if d["name"]=="iPhone 16 Pro"), phones[0] if phones else None); print(preferred["udid"] if preferred else "")')
          if [ -z "$DEVICE_ID" ]; then
            echo "No available iPhone simulator" >&2
            exit 1
          fi
          echo "SIMULATOR_ID=$DEVICE_ID" >> "$GITHUB_ENV"

      - name: Unit tests
        run: >-
          xcodebuild test
          -project DualCamera.xcodeproj
          -scheme DualCamera
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          -only-testing:DualCameraTests
          CODE_SIGNING_ALLOWED=NO

      - name: Fake Camera UI tests
        run: >-
          xcodebuild test
          -project DualCamera.xcodeproj
          -scheme DualCamera
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          -only-testing:DualCameraUITests
          CODE_SIGNING_ALLOWED=NO

      - name: Unsigned iPhoneOS build
        run: >-
          xcodebuild
          -project DualCamera.xcodeproj
          -scheme DualCamera
          -sdk iphoneos
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO
          build
